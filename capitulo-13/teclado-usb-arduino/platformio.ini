; Projeto PlatformIO. Compile com:  pio run -e <série>
; Grave e abra o monitor:             pio run -e <série> -t upload -t monitor
[platformio]
default_envs = esp32s2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; A biblioteca USB inclui FS.h, mas o LDF do PlatformIO não propaga o caminho.
build_flags = -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3]
board = esp32-s3-devkitc-1
